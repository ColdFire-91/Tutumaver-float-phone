name: Apply verified Tutumaver 1.5 selective sync
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/share-15-integrate.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply only compatible shared 035 features
        run: |
          patch --batch --forward -p1 -F3 < .share-sync/resource035-selected.patch
          test ! -f components/phone/phone-app.tsx.rej
      - name: Integrate user-approved 038 and share-only screen effects
        run: python .share-sync/complete-15.py
      - name: Check dependencies and compile mobile app
        run: |
          npm ci --no-audit --no-fund
          npm run android:web
      - name: Remove disposable update helpers
        run: |
          rm -f .github/workflows/share-15-integrate.yml
          rm -f .github/workflows/share-035-038-audit.yml
          rm -rf .share-sync
      - name: Commit complete verified 1.5 source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --stat
          git commit -m "Tutumaver 1.5: share 035+038 images and toggle-gated screen effects"
          git push origin HEAD:main
