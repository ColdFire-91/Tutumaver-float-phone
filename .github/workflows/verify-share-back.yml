name: Verify public-share back navigation
on:
  push:
    branches: [test/049-safe-port]
    paths: ['components/**', '.github/workflows/verify-share-back.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run android:web
