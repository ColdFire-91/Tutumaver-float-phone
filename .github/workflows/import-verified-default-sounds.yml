name: Import verified shared default sounds
on:
  push:
    branches: [test/1.6-full-selective-sync]
    paths: ['.github/workflows/import-verified-default-sounds.yml']
permissions:
  contents: write
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRIVATE_EXPORT_ASSET: 'https://sdmntprnznorth.oaiusercontent.com/files/00000000-6298-820b-bcb0-79b1ac166bbf/raw?se=2026-11-11T13%3A30%3A40Z&sp=r&sv=2026-06-06&sr=b&scid=58122bb4-a4d8-5543-83d5-e7ac8608e645&skoid=27fbae2c-124f-4566-a0d8-1b07a5a41c53&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-11-11T12%3A44%3A01Z&ske=2026-11-12T12%3A44%3A01Z&sks=b&skv=2026-06-06&sig=eur%2BUtYcoYGIl/NyCH1bk0HLldu8mMfwP361%2BpbR8YY%3D'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Import only the eight previously reviewed sound files
        run: |
          curl -fsSL --max-time 120 --retry 3 "$PRIVATE_EXPORT_ASSET" -o /tmp/export-artifact.zip
          unzip -p /tmp/export-artifact.zip default-sounds-for-public-share.zip > /tmp/default-sounds.zip
          echo '6319ce9a9cb58dddd5f3abc52faef8599a679c156864ab764ed845eb0e46e284  /tmp/default-sounds.zip' | sha256sum -c -
          unzip -oq /tmp/default-sounds.zip 'public/sounds/default/*.mp3'
          test "$(find public/sounds/default -name '*.mp3' | wc -l)" -eq 8
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git add public/sounds/default/
          git commit -m 'feat(public): add verified original eight default notification sound assets'
          git push origin HEAD:test/1.6-full-selective-sync
